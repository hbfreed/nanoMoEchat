[project]
name = "nanochat"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cut-cross-entropy",
    "datasets>=4.0.0",
    "einops>=0.8.0",
    "fastapi>=0.117.1",
    "files-to-prompt>=0.6",
    "matplotlib>=3.10.8",
    # cute: the CuTe DSL expert backend (base_train --moe-backend=cute, Ampere)
    "megablocks[cute] @ git+https://github.com/hbfreed/megablocks-variable.git",
    "numpy==1.26.4",
    "psutil>=7.1.0",
    "python-dotenv>=1.2.1",
    "regex>=2025.9.1",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "stanford-stk>=0.7.1",
    "tabulate>=0.9.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "rustbpe"
bindings = "pyo3"
python-source = "."
manifest-path = "rustbpe/Cargo.toml"

[dependency-groups]
dev = [
    "maturin>=1.9.4",
    "pytest>=7.2.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# target torch to cuda 13.0 or CPU (cu13 matches the nvcc used to build megablocks' nanomoe_ops)
[tool.uv.sources]
torch = [  
    { index = "pytorch-cpu", extra = "cpu" },  
    { index = "pytorch-cu130", extra = "gpu" },  
]
cut-cross-entropy = { git = "https://github.com/apple/ml-cross-entropy.git" }

[[tool.uv.index]]  
name = "pytorch-cpu"  
url = "https://download.pytorch.org/whl/cpu"  
explicit = true  
  
[[tool.uv.index]]  
name = "pytorch-cu130"  
url = "https://download.pytorch.org/whl/cu130"  
explicit = true

[project.optional-dependencies]  
cpu = [  
    "torch>=2.9.1",
]  
gpu = [  
    "torch>=2.9.1",
    # FlashAttention-2: real sliding-window kernels on Ampere (SDPA dense-masks them).
    # Built from source; needs a CUDA 13 nvcc on PATH or CUDA_HOME (~30 min, 24 jobs).
    "flash-attn==2.8.3.post1",
]  
  
[tool.uv]  
conflicts = [  
    [  
        { extra = "cpu" },  
        { extra = "gpu" },  
    ],  
]

# relu2 MoE layers use topology_var, which needs megablocks' compiled nanomoe_ops
# (off by default in the fork). Build it against the exact torch we run with;
# needs a CUDA 13 nvcc on PATH or CUDA_HOME, 13.2 or newer with glibc 2.43
# (13.0's math headers clash with glibc's new rsqrt).
[tool.uv.extra-build-dependencies]
megablocks = [{ requirement = "torch", match-runtime = true }]
flash-attn = [{ requirement = "torch", match-runtime = true }, "ninja", "packaging", "psutil", "einops"]

[tool.uv.extra-build-variables]
megablocks = { MEGABLOCKS_BUILD_EXTENSIONS = "1" }
flash-attn = { FLASH_ATTN_CUDA_ARCHS = "80", MAX_JOBS = "24", NVCC_THREADS = "2" }
